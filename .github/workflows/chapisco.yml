name: update-profile

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC = 00:00 em Brasília (o GitHub usa sempre UTC)
  workflow_dispatch: # permite rodar manualmente na aba Actions

permissions:
  contents: write

jobs:
  # 1) Gráfico 3D + data no README + UM commit por dia na branch principal
  readme:
    name: 3D graph and daily commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Stamp today's date in README
        run: |
          DATE=$(TZ=America/Sao_Paulo date '+%d/%m/%Y')
          sed -i "s#<!-- LAST_UPDATE:START -->.*<!-- LAST_UPDATE:END -->#<!-- LAST_UPDATE:START -->${DATE}<!-- LAST_UPDATE:END -->#" README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update profile ($(TZ=America/Sao_Paulo date '+%Y-%m-%d'))"
          git push

  # 2) Pac-Man: gera os SVGs e publica na branch "output"
  pacman:
    name: pacman graph
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
